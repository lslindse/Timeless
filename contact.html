<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeless by Lucy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>

    <div class="logo">
        <img src="images/logo.png" alt="Timeless Logo">
    </div>

    <div class="navigation">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="shop.html">SHOP</a>
        <a href="sourcing.html">SOURCING</a>
        <a href="contact.html">CONTACT</a>
    </div>

</header>
  <main class="contact">
    <h1>CONTACT US</h1>
    <h2>we'd love to hear from you!</h2>
    <section class="contact-img">
      <img src="images/contact.jpg">
    </section>
    <section class="contact-form">
      <form>
        <div class="row">
          <div class="col">
            <input type="text" class="form-control" placeholder="First name" aria-label="First name">
          </div>
          <div class="col">
            <input type="text" class="form-control" placeholder="Last name" aria-label="Last name">
          </div>
        </div>
        <div class="mb-3">
          <label for="exampleFormControlInput1" class="form-label">Email address</label>
          <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label for="exampleFormControlTextarea1" class="form-label">Comments and Concerns</label>
          <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn text-white bg-secondary">Submit</button>
      </form>
    </section>
    <footer class="footer">
        <div class="footer-icons">
            <img src="images/instagram.png" alt="">
            <img src="images/mail.png" alt="">
        </div>
        <div class="footer-text">
            <p>© 2026 TIMELESS BY LUCY</p>
        </div>
    </footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
